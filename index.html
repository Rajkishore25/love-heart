<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: Georgia, serif;
    color: #fff;

    padding: 20px;

    background:
        radial-gradient(circle at 50% 40%, #5a2639 0%, #321521 38%, #170b12 75%, #0d070b 100%);
}

/* soft romantic glow */

body::before {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;

    left: 50%;
    top: 45%;

    transform: translate(-50%, -50%);

    background: radial-gradient(
        circle,
        rgba(255, 90, 130, 0.18),
        transparent 70%
    );

    filter: blur(25px);
    pointer-events: none;
}

/* Card */

.card {
    position: relative;
    z-index: 10;

    width: 100%;
    max-width: 440px;

    padding: 38px 28px;

    text-align: center;

    background: rgba(255, 255, 255, 0.08);

    border: 1px solid rgba(255, 255, 255, 0.16);

    border-radius: 28px;

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255,255,255,0.12);
}

/* Heading */

h1 {
    margin: 0 0 10px;

    font-size: 27px;
    font-weight: normal;

    letter-spacing: 0.3px;

    text-shadow:
        0 2px 15px rgba(255, 100, 140, 0.35);
}

.subtitle {
    margin: 0 0 30px;

    font-family: Arial, sans-serif;

    font-size: 14px;
    line-height: 1.6;

    color: rgba(255,255,255,0.72);
}

/* Envelope */

.envelope {
    display: inline-block;

    font-size: 125px;

    cursor: pointer;

    filter:
        drop-shadow(0 0 12px rgba(255,100,140,0.35))
        drop-shadow(0 18px 25px rgba(0,0,0,0.35));

    animation:
        gentleFloat 3s ease-in-out infinite;

    transition: transform 0.3s ease;
}

.envelope:hover {
    transform: scale(1.08);
}

.envelope:active {
    transform: scale(0.94);
}

@keyframes gentleFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-9px);
    }
}

/* Button */

button {
    border: 1px solid rgba(255,255,255,0.2);

    border-radius: 40px;

    padding: 14px 28px;

    background:
        linear-gradient(
            135deg,
            #a82f55,
            #d45b7c
        );

    color: white;

    font-family: Georgia, serif;

    font-size: 16px;

    cursor: pointer;

    box-shadow:
        0 10px 30px rgba(180,50,90,0.35);

    transition: all 0.3s ease;
}

button:hover {
    transform: translateY(-3px) scale(1.02);

    box-shadow:
        0 15px 35px rgba(220,70,110,0.45);
}

.small {
    margin-top: 17px;

    font-family: Arial, sans-serif;

    font-size: 12px;

    color: rgba(255,255,255,0.5);
}

/* Letter */

.letter {
    display: none;

    position: relative;

    background:
        linear-gradient(
            135deg,
            #fffaf1,
            #fff2f5
        );

    color: #4a2630;

    padding: 30px;

    border-radius: 18px;

    text-align: left;

    line-height: 1.85;

    font-size: 17px;

    box-shadow:
        0 25px 60px rgba(0,0,0,0.4);

    animation:
        letterReveal 1s cubic-bezier(.17,.67,.32,1.3);
}

.letter::before {
    content: "♥";

    display: block;

    text-align: center;

    font-size: 25px;

    margin-bottom: 12px;

    opacity: 0.7;
}

@keyframes letterReveal {

    from {
        opacity: 0;
        transform:
            translateY(50px)
            scale(0.85)
            rotateX(10deg);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1)
            rotateX(0);
    }
}

/* BALLOONS */

.balloon {
    position: fixed;

    bottom: -180px;

    z-index: 3;

    pointer-events: none;

    font-size: 75px;

    filter:
        drop-shadow(0 8px 12px rgba(0,0,0,0.25));

    animation:
        balloonFly linear forwards;
}

@keyframes balloonFly {

    0% {
        transform:
            translate3d(0, 0, 0)
            rotate(-8deg)
            scale(0.8);

        opacity: 0;
    }

    8% {
        opacity: 1;
    }

    25% {
        transform:
            translate3d(55px, -25vh, 0)
            rotate(8deg)
            scale(1);
    }

    50% {
        transform:
            translate3d(-50px, -52vh, 0)
            rotate(-8deg)
            scale(1.05);
    }

    75% {
        transform:
            translate3d(45px, -78vh, 0)
            rotate(8deg)
            scale(1.1);
    }

    100% {
        transform:
            translate3d(-20px, -125vh, 0)
            rotate(-5deg)
            scale(1.15);

        opacity: 0;
    }
}

/* Tiny floating hearts */

.heart {
    position: fixed;

    bottom: -30px;

    z-index: 1;

    pointer-events: none;

    opacity: 0.6;

    animation: heartFloat linear forwards;
}

@keyframes heartFloat {

    from {
        transform: translateY(0) scale(0.8);
        opacity: 0;
    }

    15% {
        opacity: 0.7;
    }

    to {
        transform: translateY(-110vh) scale(1.2);
        opacity: 0;
    }
}

/* Mobile */

@media(max-width:500px) {

    .card {
        padding: 32px 20px;
    }

    h1 {
        font-size: 24px;
    }

    .envelope {
        font-size: 105px;
    }

    .letter {
        padding: 23px;
        font-size: 16px;
    }

    .balloon {
        font-size: 65px;
    }
}
</style>
